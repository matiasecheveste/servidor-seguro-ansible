---
# Servidor seguro con Ansible — Matías Nicolás Echeveste Cardozo
- name: Instalar fail2ban
  ansible.builtin.apt:
    name: [fail2ban, python3-systemd]
    state: present

- name: Configurar las cárceles de fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar fail2ban

- name: Asegurar que fail2ban esté activo
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
